name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # GitHub only: other forges that also read .github/workflows skip this job.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10 --activate
      - working-directory: web
        run: pnpm install --frozen-lockfile && pnpm run typecheck && pnpm test && pnpm run build
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go vet ./... && go test ./...
